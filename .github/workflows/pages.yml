name: Deploy to GitHub Pages
# After CI passes on main, publish that exact commit to the gh-pages branch,
# which GitHub Pages serves at https://zpidero.github.io/LvtPortfolio/
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types:
      - completed
permissions:
  contents: write
jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Publish to gh-pages
        run: git push --force origin HEAD:refs/heads/gh-pages
